[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "island-quant"
version = "0.1.0"
description = "A safety-first, point-in-time quantitative research and trading system for Taiwan equities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Island Quant" }]
dependencies = [
  "duckdb>=1.4,<2",
  "polars>=1.35,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
island-quant = "island_quant.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not network'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "network: tests that call external provider APIs (excluded by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "app.py",
  "twbacktest",
  "tests/test_data_provider.py",
  "tests/test_engine.py",
  "tests/test_factors.py",
  "tests/test_http.py",
  "tests/test_monitoring.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/island_quant"]
