environment: development
timezone: Asia/Taipei
base_currency: TWD

research:
  random_seed: 42
  data_root: data
  artifact_root: artifacts

data:
  provider: finmind
  raw_root: data/raw
  normalized_root: data/normalized
  checkpoint_root: state/ingestion
  catalog_path: state/catalog.duckdb
  schema_version: 1
  request_attempts: 4
  request_timeout_seconds: 30

universe:
  policy_version: tw-equity-v1
  minimum_listing_days: 60
  trailing_median_window: 20
  minimum_trailing_median_traded_value: "5000000"
  minimum_lookback_observations: 20

availability:
  policy_version: tw-daily-v1
  publication_time: "17:30:00"
  finalization_buffer_minutes: 30

dataset_versions:
  transformation_code_version: phase1-slice2-v1
  configuration_version: default-v1
  corporate_action_schema_version: 1
  label_schema_version: 1

trading:
  mode: backtest
  live_enabled: false
  allow_short: false
  initial_cash: "1000000"
  maximum_gross_exposure: "1.0"
  maximum_net_exposure: "1.0"
  maximum_position_weight: "0.10"

logging:
  level: INFO
  json: true
